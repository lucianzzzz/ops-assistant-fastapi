[project]
name = "ops-assistant-fastapi"
version = "0.1.0"
description = "Smart ops assistant demo powered by FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "jinja2>=3.1,<4.0",
  "langchain>=0.1.0,<1.0",
  "langchain-openai>=0.0.5,<1.0",
  "python-dotenv>=1.0.0,<2.0",
  "sentence-transformers>=2.2.0,<3.0",
  "chromadb>=0.4.0,<1.0",
  "openai>=1.0.0,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=4.1,<5.0",
  "httpx>=0.27,<1.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
